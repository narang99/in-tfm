# Run with: python scripts/run_neuron_report.py --config configs/attn_only_2l_q_proj.yaml
# Any flag overrides the file, e.g. --clustering.strategy.min-cluster-size 10
model: self/attn-only-2l
layer_name: layers.0.self_attn.q_proj
neuron_start: 3
neuron_end: 4
out_dir: reports/attn_only_2l
text:
  n_samples: 48
  max_length: 64
clustering:
  strategy:
    method: hdbscan
    min_cluster_size: 5
