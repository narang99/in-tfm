# mixed4e:55 with the density-peak forest.
# The cluster report and the bucket report, linked to each other:
#   uv run --extra inception python scripts/space_reports.py --config configs/inception_v1_mixed4e_peaks.yaml
# The older single cluster report, which clusters again on its own:
#   uv run --extra inception python scripts/run_neuron_report.py --config configs/inception_v1_mixed4e_peaks.yaml
model: lucent/inception-v1
target: conv
layer_name: mixed4e_1x1_pre_relu_conv
neurons: [55]
batch_size: 16
out_dir: reports/space_mixed4e
inception:
  n_images: 2000
clustering:
  "on": hadamard  # quoted, since YAML 1.1 reads a bare `on` as true
  distance: weighted_jaccard
  normalise: false
  strategy:
    method: density_peaks
    k: 5
    peak_share: 0.8
    max_entropy: 0.5
