# Run with: uv run python scripts/run_neuron_report.py --config configs/stl_inception_conv.yaml
# A 3x3 conv in block_b, on the first 500 STL-10 test images.
model: self/stl-inception
target: conv
layer_name: block_b.branch_3x3.1.0
neuron_start: 0
neuron_end: 3
batch_size: 16
out_dir: reports_stl
stl:
  n_images: 500
