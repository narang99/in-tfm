# Qwen3-32B layer 55 MLP neuron 11703, its gate_proj row. The up_proj row runs with --layer-name.
# Goodfire's "Neurons as an interpretable basis" calls it a Colorado neuron with a rare Tornado mode.
#   - Clustering its firings by upstream inputs separates Colorado from Tornado perfectly, they say.
#   - Tornado is a Python web framework. It barely appears in web text, so Python code is mixed in.
#   - The code is not filtered for Tornado. About 0.37% of codeparrot files import it.
# Layers 0..55 are about 57 GB in bf16, so this needs an A100 80GB.
#   python scripts/run_neuron_report.py --config configs/qwen3_32b_l55_11703_colorado.yaml
model: Qwen/Qwen3-32B
layer_name: layers.55.mlp.gate_proj
neurons: [11703]
polarity: signed
batch_size: 8
out_dir: reports/qwen3-32b/layers.55.mlp.gate_proj
text:
  max_length: 512
  n_samples: 15000
  mix:
    - dataset: HuggingFaceFW/fineweb
      dataset_config: sample-10BT
      unit: document
      streaming: true
      share: 4  # 12000 documents
    - dataset: codeparrot/codeparrot-clean
      column: content
      unit: document
      streaming: true
      share: 1  # 3000 files
hits:
  method: elbow  # every position above each tail's elbow, subsampled to max_hits
  max_hits: 250000
clustering:
  "on": hadamard  # quoted, since YAML 1.1 reads a bare `on` as true
  strategy:
    method: hdbscan
    min_cluster_size: 25
    min_samples: 8  # Marin's pile-10k sweep choice, see experiments/marin-l16-19311.md
    selection_method: leaf
report:
  max_hits_per_cluster: 5
