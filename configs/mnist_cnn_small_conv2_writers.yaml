# Every conv2 channel of the 2/4 network, as the writers of the head's dependency reports.
# Same as mnist_cnn_small_conv2.yaml, written to its own directory so older reports stay untouched.
# Run with: uv run python scripts/run_neuron_report.py --config configs/mnist_cnn_small_conv2_writers.yaml
model: self/mnist-cnn-small
layer_name: conv2
neuron_start: 0
neuron_end: 3
batch_size: 64
out_dir: reports/mnist_cnn_small_conv2_writers
mnist:
  images_per_class: 100
