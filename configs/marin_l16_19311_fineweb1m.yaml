# As configs/marin_l16_19311.yaml, on the Marin atlas's own fineweb-1m documents instead of pile-10k.
# The 489 documents are their FineWeb sample (seed 20261024), each one 2,048-token window with BOS, 1,001,472 tokens.
# One window per batch: eager attention scores over 2,048 tokens in float32 are 0.67 GB per window, and 2 ran out of memory on the L4.
#   python scripts/marin_sweep_report.py --config configs/marin_l16_19311_fineweb1m.yaml
model: marin-community/marin-32b-base
layer_name: layers.16.mlp.gate_proj
neurons: [19311]
polarity: signed
batch_size: 1
out_dir: reports/marin-32b-fineweb-1m/layers.16.mlp.gate_proj
text:
  dataset: Station-house/marin-32b-neuron-atlas
  dataset_config: fineweb-1m.docs
  split: train
  unit: document
  n_samples: 489
  max_length: 2048
hits:
  method: bucketed
  max_hits: 250000
clustering:
  "on": hadamard  # quoted, since YAML 1.1 reads a bare `on` as true
  strategy:
    method: hdbscan
    selection_method: leaf
report:
  max_hits_per_cluster: 5
