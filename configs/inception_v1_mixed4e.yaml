# Run with: uv run --extra inception python scripts/run_neuron_report.py --config configs/inception_v1_mixed4e.yaml
# Lucid's mixed4e:55 is channel 55 of the 1x1 branch of mixed4e, read before its ReLU.
# The pool is built by in_tfm.models.inception_v1.prepare_images: 100 images of each of 123 classes.
model: lucent/inception-v1
layer_name: mixed4e_1x1_pre_relu_conv
neurons: [55]
batch_size: 16
out_dir: reports/inception_v1
