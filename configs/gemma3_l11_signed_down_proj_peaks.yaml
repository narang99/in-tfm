# Both tails of Gemma 3 270M layer 11 MLP neuron 332, sampled and clustered together.
# Otherwise as configs/gemma3_l11_down_proj_peaks.yaml.
# down_proj neurons sit after gelu(gate) * up, and `up` takes either sign, so strong negative firings are possible.
#   uv run python scripts/run_neuron_report.py --config configs/gemma3_l11_signed_down_proj_peaks.yaml
model: google/gemma-3-270m
target: down_proj
layer_idx: 11
neurons: [332]
polarity: signed
batch_size: 16
out_dir: reports/gemma3_l11
text:
  n_samples: 2000
  max_length: 128
hits:
  method: bucketed  # equal-width buckets over the whole signed range, so neither tail is assumed to matter more
clustering:
  "on": hadamard  # quoted, since YAML 1.1 reads a bare `on` as true
  distance: weighted_jaccard
  normalise: false
  strategy:
    method: density_peaks
    k: 5
    peak_share: 0.8
    max_entropy: 0.5
