# Gemma 3 270M layer 11 MLP neuron 332, with the clustering of configs/inception_v1_mixed4e_peaks.yaml and bucketed hits.
# Neuron 332 was picked at random from the 640 outputs of down_proj.
# A hit's Hadamard is over the 2048 MLP dims that feed down_proj.
#   uv run python scripts/space_reports.py --config configs/gemma3_l11_down_proj_peaks.yaml
model: google/gemma-3-270m
target: down_proj
layer_idx: 11
neurons: [332]
batch_size: 16
out_dir: reports/space_gemma3_l11
text:
  n_samples: 2000  # as many samples as the inception run has images
  max_length: 128
hits:
  method: bucketed  # equal shares from equal-width activation buckets, assuming nothing about the elbow
clustering:
  "on": hadamard  # quoted, since YAML 1.1 reads a bare `on` as true
  distance: weighted_jaccard
  normalise: false
  strategy:
    method: density_peaks
    k: 5
    peak_share: 0.8
    max_entropy: 0.5
