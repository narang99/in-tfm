<div style="position:relative;display:inline-block;max-width:100%">
<img src="{{ map_src }}" alt="{{ map_alt }}" style="display:block;max-width:100%;height:auto">
{% for m in marks %}
<a href="{{ m.href }}" title="{{ m.title }}" aria-label="{{ m.title }}" style="position:absolute;left:{{ '%.3f'|format(m.left) }}%;top:{{ '%.3f'|format(m.top) }}%;width:{{ m.size }}%;height:{{ m.size }}%;transform:translate(-50%,-50%);border-radius:50%"></a>
{% endfor %}
</div>
{% if huge_map_src is defined %}<p class="meta"><a href="{{ huge_map_src }}" target="_blank">The same map at 4x size</a>, to zoom into a crowded corner.</p>{% endif %}
