<section class="cluster" id="cluster-{{ cluster_id }}" style="{{ style }}"{% if median_activation is not none %} data-median="{{ "%.4f"|format(median_activation) }}"{% endif %}>
<header class="cluster-head"><span class="cluster-badge">Cluster {{ cluster_id }}</span><span class="cluster-stats">n={{ n_hits }} &middot; {{ n_unique_images }} unique samples</span></header>
<div class="cluster-body pending"><template class="lazy-body">
{{ body|safe }}
</template></div>
</section>
