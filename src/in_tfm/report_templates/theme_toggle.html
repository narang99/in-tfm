<style>
:root[data-theme="light"] { color-scheme:light;
  --bg:#fff; --fg:#1a1a1a; --muted:#777; --line:#e3e3e3; --panel:#fafafa; --warn:#c62828; }
:root[data-theme="dark"] { color-scheme:dark;
  --bg:#161616; --fg:#e6e6e6; --muted:#9a9a9a; --line:#333; --panel:#1e1e1e; --warn:#ff6b6b; }
:root[data-theme="light"] .tok { background:var(--bg-l); color:var(--fg-l); }
:root[data-theme="dark"] .tok { background:var(--bg-d); color:var(--fg-d); }
.theme-toggle { position:fixed; top:12px; right:12px; z-index:10; padding:4px 12px; font-size:0.8rem;
  border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); cursor:pointer; }
</style>
<button class="theme-toggle" id="theme-toggle">Toggle theme</button>
<script>
(() => {
  const root = document.documentElement;
  const systemDark = () => window.matchMedia("(prefers-color-scheme: dark)").matches;
  try { const saved = localStorage.getItem("report-theme"); if (saved) root.dataset.theme = saved; } catch (e) {}
  document.getElementById("theme-toggle").addEventListener("click", () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : systemDark();
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("report-theme", root.dataset.theme); } catch (e) {}
    document.dispatchEvent(new Event("themechange"));
  });
})();
</script>
