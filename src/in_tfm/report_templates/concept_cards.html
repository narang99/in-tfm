{#
Concept cards for a residual dim: the embedding, then one card per head, in fixed slots.
Pages include this once and call `ConceptCards.stack(...)`. See `ov_graph.html` for the maths the cards show.
#}
<style>
:root { --pos:{{ colors.pos_light }}; --neg:{{ colors.neg_light }}; }
@media (prefers-color-scheme: dark) { :root { --pos:{{ colors.pos_dark }}; --neg:{{ colors.neg_dark }}; } }
:root[data-theme="light"] { --pos:{{ colors.pos_light }}; --neg:{{ colors.neg_light }}; }
:root[data-theme="dark"] { --pos:{{ colors.pos_dark }}; --neg:{{ colors.neg_dark }}; }
.ov-stage { font-size:0.7rem; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; color:var(--muted); margin:14px 0 6px; }
.concept { border:1px solid var(--line); border-left:6px solid var(--c); border-radius:4px; background:var(--panel);
  padding:6px 10px; margin:0 0 8px; }
.concept.off { background:#000; border-left-color:#000; }
.concept.off > * { visibility:hidden; }
.concept-head { font:0.75rem ui-monospace,Menlo,monospace; display:flex; gap:14px; align-items:baseline; }
.concept-head .value { font-weight:700; color:var(--c); }
.concept .tokens { margin:4px 0; }
.concept pre { white-space:pre; margin:0; font:0.7rem ui-monospace,Menlo,monospace; color:var(--muted); }
</style>
<script>
const ConceptCards = (() => {
  const stops = { light: {{ token_stops.light|tojson }}, dark: {{ token_stops.dark|tojson }} };
  const fmt = (x, d = 3) => (x >= 0 ? "+" : "") + x.toFixed(d);
  const pct = x => (100 * x).toFixed(1) + "%";
  const signColor = x => x >= 0 ? "var(--pos)" : "var(--neg)";

  function hexToRgb(hex) { return [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16)); }
  function rgbToHex(rgb) { return "#" + rgb.map(c => Math.round(c).toString(16).padStart(2, "0")).join(""); }

  /* Linear in RGB between the map's three stops, which is how a three-colour LinearSegmentedColormap interpolates. */
  function mapColor(mapStops, value, vmax) {
    const x = vmax > 0 ? Math.min(Math.max((value + vmax) / (2 * vmax), 0), 1) : 0.5;
    const [lo, hi, f] = x < 0.5 ? [mapStops[0], mapStops[1], x * 2] : [mapStops[1], mapStops[2], (x - 0.5) * 2];
    const a = hexToRgb(lo), b = hexToRgb(hi);
    return rgbToHex(a.map((c, i) => c + (b[i] - c) * f));
  }

  function readableFg(hex) {
    const [r, g, b] = hexToRgb(hex).map(c => c / 255);
    return 0.2126 * r + 0.7152 * g + 0.0722 * b > 0.55 ? "#111" : "#fff";
  }

  function tokenStyle(value, vmax) {
    const light = mapColor(stops.light, value, vmax), dark = mapColor(stops.dark, value, vmax);
    return `--bg-l:${light};--fg-l:${readableFg(light)};--bg-d:${dark};--fg-d:${readableFg(dark)}`;
  }

  /* Kneedle, as in `hit_selection.strategies.elbow.find_elbow_index_in_sorted_data`: the point of an ascending
     curve furthest from the chord between its ends. Only values strictly above it are kept. */
  function elbowCutoff(ascending) {
    const n = ascending.length, [x1, y1, x2, y2] = [0, ascending[0], n - 1, ascending[n - 1]];
    const chord = Math.hypot(y2 - y1, x2 - x1);
    let best = 0, bestDistance = -1;
    ascending.forEach((y, x) => {
      const distance = Math.abs((y2 - y1) * x - (x2 - x1) * y + x2 * y1 - y2 * x1) / chord;
      if (distance > bestDistance) { best = x; bestDistance = distance; }
    });
    return ascending[best];
  }

  function keptConcepts(list) {
    if (list.length < 3) return new Set(list);
    const cutoff = elbowCutoff(list.map(c => Math.abs(c.value)).sort((x, y) => x - y));
    return new Set(list.filter(c => Math.abs(c.value) > cutoff));
  }

  /* `view.tokens[i]` is position `view.offset + i`, and the last one is the current position.
     A concept's `outside` is the part of its value from positions before the shown tokens. */
  function card(concept, view, scale, kept) {
    const node = document.createElement("div");
    node.className = "concept" + (kept ? "" : " off");
    node.style.setProperty("--c", signColor(concept.value));
    node.style.opacity = 0.2 + 0.8 * Math.abs(concept.value) / scale;

    const head = document.createElement("div");
    head.className = "concept-head";
    head.innerHTML = "<span></span><span class=\"value\"></span><span></span>";
    head.children[0].textContent = concept.label;
    head.children[1].textContent = fmt(concept.value);
    head.children[2].textContent = `${pct(Math.abs(concept.value) / scale)} of this dim's largest`;
    node.appendChild(head);

    const bySource = new Map(concept.parts.map(p => [p.s, p]));
    const vmax = Math.max(...concept.parts.map(p => Math.abs(p.part)), 1e-9);
    const current = view.offset + view.tokens.length - 1;
    const row = document.createElement("div");
    row.className = "tokens";
    view.tokens.forEach((text, i) => {
      const s = view.offset + i, p = bySource.get(s);
      const chip = document.createElement("span");
      chip.className = "tok" + (s === current ? " tok-firing" : "");
      chip.style.cssText = tokenStyle(p ? p.part : 0, vmax);
      chip.textContent = text;
      if (p && concept.label !== "W_E") chip.title = `part ${fmt(p.part)}, attention ${pct(p.a)}, v.w ${fmt(p.vw)}`;
      row.appendChild(chip);
    });
    node.appendChild(row);

    if (concept.label !== "W_E") {
      const outside = concept.outside || 0;
      const total = concept.parts.reduce((sum, p) => sum + Math.abs(p.part), 0) + Math.abs(outside) || 1;
      const lines = [...concept.parts].sort((p, q) => Math.abs(q.part) - Math.abs(p.part)).slice(0, 3)
        .map(p => `${(JSON.stringify(view.tokens[p.s - view.offset]) + " @" + p.s).padEnd(18)} part ${fmt(p.part)}  ` +
          `A ${pct(p.a).padStart(6)}  v.w ${fmt(p.vw)}  ${pct(Math.abs(p.part) / total).padStart(6)} of card`);
      if (view.offset > 0) lines.push(`earlier tokens      part ${fmt(outside)}  ${pct(Math.abs(outside) / total).padStart(6)} of card`);
      const detail = document.createElement("pre");
      detail.textContent = lines.join("\n");
      node.appendChild(detail);
    }
    return node;
  }

  /* Appends the stage labels and the cards to `box`. Slots never move: W_E first, then heads in index order. */
  function stack(box, concepts, view, scale) {
    const kept = keptConcepts(concepts);
    let stage = null;
    for (const concept of concepts) {
      if (concept.stage !== stage) {
        stage = concept.stage;
        const label = document.createElement("div");
        label.className = "ov-stage";
        label.textContent = stage;
        box.appendChild(label);
      }
      box.appendChild(card(concept, view, scale, kept.has(concept)));
    }
  }

  return { stack, fmt, pct, signColor };
})();
</script>
