<table class="borders">
<thead><tr><th>clusters</th><th>hits</th><th>of all hits</th><th></th></tr></thead>
<tbody>
{% for row in rows %}
<tr><td>{{ row.chips|safe }}</td><td>{{ "{:,}".format(row.hits) }}</td><td>{{ "{:.1%}".format(row.share) }}</td><td>{% if row.page %}<a href="{{ row.page }}">hits &rarr;</a>{% endif %}</td></tr>
{% endfor %}
</tbody>
</table>
