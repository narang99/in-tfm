[project]
name = "in-tfm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "narang99", email = "hariom2711@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "captum>=0.9.0",
    "hdbscan>=0.8.39",
    "jaxtyping>=0.3.11",
    "lxt>=2.1",
    "matplotlib>=3.8",
    "nnsight>=0.7.0",
    "numpy>=2.1",
    "pydantic>=2.7",
    "pydicom>=3.0.2",
    "rad-dino>=0.1.1",
    "scikit-learn>=1.3",
    "torch>=2.11",
    "tqdm>=4.66",
    "transformers>=5.16",
]

# Floors are deliberately low: Colab preinstalls torch/numpy/scikit-learn/transformers built
# against its own CUDA and ABI, and any floor above those forces uv to reinstall them - which
# for torch means replacing the cu128 build with a generic PyPI wheel. Raise a floor only for
# an API this code actually needs.
#   - transformers >=5.16: 5.x moved to AttentionInterface and dropped
#     find_pruneable_heads_and_indices; see attribution.py and compat.py.
#   - nnsight >=0.7: the .trace() context API used in activations.py.
#   - hdbscan >=0.8.39: known to coexist with cuml without API breaks; see clustering.py.

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
]

[project.scripts]
in-tfm = "in_tfm:main"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"
