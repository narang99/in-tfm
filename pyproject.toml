[project]
name = "in-tfm"
version = "0.1.0"
description = "Clusters a neuron's high-activation hits by which input dimensions drove them"
readme = "README.md"
authors = [
    { name = "narang99", email = "hariom2711@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=2.14",
    "hdbscan>=0.8.39",
    "huggingface-hub>=0.20",
    "jaxtyping>=0.3.11",
    "jinja2>=3.0",
    "lxt>=2.1",
    "markupsafe>=2.0",
    "matplotlib>=3.8",
    "networkx>=3.0",
    "nnsight>=0.7.0",
    "numpy>=2.1",
    "pillow>=10.0",
    "plotly>=5.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "pyyaml>=6",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "tokenizers>=0.15",
    "torch>=2.11",
    "torchvision>=0.20",
    "tqdm>=4.66",
    "transformers>=5.0",
]

# Floors are deliberately low.
# - Colab preinstalls torch, numpy, scikit-learn and transformers, built against its own CUDA and ABI.
# - Any floor above those forces uv to reinstall them.
#   - For torch that means replacing the cu128 build with a generic PyPI wheel.
# - Raise a floor only for an API this code actually needs.
#   - transformers >=5.0: 5.x moved to AttentionInterface and dropped find_pruneable_heads_and_indices.
#     See attribution/attnlrp.py and compat.py.
#   - nnsight >=0.7: the .trace() context API used in neuron_capture.py.
#   - hdbscan >=0.8.39: known to coexist with cuml without API breaks. See clustering.py.
#   - datasets >=2.14: only `load_dataset(path, name, split=...)` is used, which is far older.
# - The rest are plain floors well below Colab's preinstalls.

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.optional-dependencies]
# The PyPI release pins kornia<=0.4.1, which does not install on a current python.
# The `dev` branch (see tool.uv.sources) lifts the pin, so this extra needs uv, not pip.
inception = [
    "torch-lucent",
]
# Explainer videos in scripts/videos.
# - pycairo has no macOS wheel, so it builds from source.
#   - That needs `brew install pkgconf cairo pango`.
video = [
    "manim>=0.19",
]
# JupyterLab that Claude can edit live, through the jupyter MCP server.
# - jupyter-collaboration gives the shared document the MCP edits go through.
notebook = [
    "ipykernel>=7.0",
    "jupyter-collaboration>=5.0",
    "jupyter-mcp-tools>=0.1.8",
    "jupyterlab>=4.6",
    "jupytext>=1.19",
]

station_house = [
    "duckdb>=1.3.0",
]

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch-lucent = { git = "https://github.com/greentfrapp/lucent", rev = "dev" }

[tool.ty.environment]
python = ".venv"

[tool.ty.analysis]
# Optional deps: triton and cuml only exist on a CUDA box, lucent only with the `inception` extra.
allowed-unresolved-imports = ["triton", "triton.**", "cuml", "cuml.**", "lucent", "lucent.**"]

[tool.ty.rules]
# torch declares `forward` as a callable attribute, so every `def forward` override is flagged.
invalid-mutable-override = "ignore"

[tool.ruff.lint]
extend-select = ["I"]
# F821 reads jaxtyping shape strings such as "batch seq" as undefined names.
# ty's unresolved-reference still catches real ones.
ignore = ["F821"]
